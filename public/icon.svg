<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="#334155" stroke-width="4" stroke-dasharray="8 8" opacity="0.4" />
  
  <!-- Hmong Diamond Motif Frame -->
  <polygon points="256,70 420,256 256,442 92,256" stroke="url(#accentGrad)" stroke-width="6" fill="none" opacity="0.8" />
  <polygon points="256,110 380,256 256,402 132,256" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.3" />

  <!-- Acoustic Speech Soundwaves -->
  <rect x="180" y="210" width="12" height="92" rx="6" fill="url(#waveGrad)" />
  <rect x="206" y="170" width="12" height="172" rx="6" fill="url(#waveGrad)" />
  <rect x="232" y="140" width="12" height="232" rx="6" fill="url(#waveGrad)" />
  <rect x="256" y="110" width="16" height="292" rx="8" fill="#ffffff" />
  <rect x="284" y="140" width="12" height="232" rx="6" fill="url(#waveGrad)" />
  <rect x="310" y="170" width="12" height="172" rx="6" fill="url(#waveGrad)" />
  <rect x="336" y="210" width="12" height="92" rx="6" fill="url(#waveGrad)" />

  <!-- Hmong Tone Diacritic Symbol Dot & Arc -->
  <circle cx="256" cy="74" r="14" fill="#f59e0b" />
  <circle cx="256" cy="438" r="14" fill="#10b981" />
  <circle cx="92" cy="256" r="12" fill="#06b6d4" />
  <circle cx="420" cy="256" r="12" fill="#ef4444" />
</svg>
